<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#121236"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#7f00ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #8a99ad;
      letter-spacing: 1px;
    }
    .quantum-text {
      fill: url(#cyanPurple);
    }
    .orbit-line {
      fill: none;
      stroke-dasharray: 6, 8;
      opacity: 0.6;
    }
    .orbit-1 { stroke: #00f2fe; animation: spin 20s linear infinite; transform-origin: 950px 150px; }
    .orbit-2 { stroke: #e100ff; animation: spin-reverse 15s linear infinite; transform-origin: 950px 150px; }
    .orbit-3 { stroke: #4facfe; animation: spin 25s linear infinite; transform-origin: 950px 150px; }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .nucleus {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: 950px 150px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Decorative Quantum Wave / Circuit Lines -->
  <path d="M 80 150 Q 200 80, 320 150 T 560 150" fill="none" stroke="url(#purplePink)" stroke-width="3" opacity="0.4" filter="url(#glow)"/>
  <path d="M 80 150 Q 200 220, 320 150 T 560 150" fill="none" stroke="url(#cyanPurple)" stroke-width="3" opacity="0.4" filter="url(#glow)"/>

  <!-- Left Text Content -->
  <text x="90" y="125" class="title">
    <tspan class="quantum-text">Awesome</tspan> Quantum Algorithm
  </text>
  <text x="90" y="170" class="title">
    Development ⚛️
  </text>
  <text x="90" y="215" class="subtitle">
    Curated Frameworks, SaaS Platforms, SDKs &amp; Fault-Tolerant Tools
  </text>

  <!-- Right Quantum Atom Visualization -->
  <circle cx="950" cy="150" r="90" fill="url(#coreGlow)" />

  <!-- Quantum Orbits -->
  <ellipse cx="950" cy="150" rx="100" ry="35" class="orbit-line orbit-1" stroke-width="2" transform="rotate(30 950 150)"/>
  <ellipse cx="950" cy="150" rx="100" ry="35" class="orbit-line orbit-2" stroke-width="2" transform="rotate(90 950 150)"/>
  <ellipse cx="950" cy="150" rx="100" ry="35" class="orbit-line orbit-3" stroke-width="2" transform="rotate(150 950 150)"/>

  <!-- Orbiting Electrons -->
  <circle cx="1035" cy="190" r="5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="950" cy="50" r="5" fill="#e100ff" filter="url(#glow)"/>
  <circle cx="865" cy="110" r="5" fill="#4facfe" filter="url(#glow)"/>

  <!-- Center Nucleus -->
  <circle cx="950" cy="150" r="16" fill="url(#cyanPurple)" class="nucleus" filter="url(#glow)"/>
  <circle cx="950" cy="150" r="8" fill="#ffffff"/>
</svg>
